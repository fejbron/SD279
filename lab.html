<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SD279 Visual Lab</title>
  <meta name="description" content="Step-by-step 3D animations of data structures and algorithms — SD279, University of Mines and Technology." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="lab">
  <div class="lab-root">
    <div id="stage"></div>

    <header class="topbar">
      <a class="brand glass" href="/" aria-label="SD279 home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg></span>
        <span class="name">SD279<small>VISUAL LAB</small></span>
      </a>
      <button class="picker-btn glass" id="pickerBtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="ic" id="pickerIcon"></span>
        <span style="min-width:0;text-align:left"><span class="t" id="pickerTitle">Loading…</span><span class="c" id="pickerCat"></span></span>
        <kbd>/</kbd>
      </button>
      <div class="spacer"></div>
      <div class="live-chip glass"><span class="dot-live"></span><span class="lbl">Step</span> <b id="stepChip">0 / 0</b></div>
    </header>

    <div class="picker glass" id="picker" role="listbox">
      <input id="pickerSearch" placeholder="Search structures & algorithms…" autocomplete="off" />
      <div class="list" id="pickerList"></div>
    </div>

    <div class="stats-dock" id="statsDock"></div>

    <div class="cam-dock glass" id="camDock" style="top:180px;left:14px">
      <button class="icon-btn" data-cam="in" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" data-cam="out" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="icon-btn" data-cam="left" title="Rotate left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="icon-btn" data-cam="right" title="Rotate right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="icon-btn" data-cam="reset" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></button>
    </div>


    <div class="dock">
      <section class="explain glass" aria-live="polite">
        <div class="head">
          <span class="eyebrow">What’s happening</span>
          <span class="pill" id="phasePill">Start</span>
        </div>
        <p class="msg" id="msg"></p>
        <div class="phases" id="phases"></div>
      </section>

      <div class="player glass">
        <button class="icon-btn" id="firstBtn" title="First step (Home)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 6l-8 6 8 6Z"/></svg></button>
        <button class="icon-btn" id="prevBtn" title="Previous step (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="play" id="playBtn" title="Play / pause (Space)"></button>
        <button class="icon-btn" id="nextBtn" title="Next step (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <div class="scrub">
          <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Step" />
          <div class="lbl"><span id="scrubA">step 1</span><span id="scrubB">of 1</span></div>
        </div>
        <select class="speed" id="speed" aria-label="Speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
        </select>
      </div>
    </div>

    <aside class="side glass">
      <div class="side-scroll">
        <span class="eyebrow" id="sideCat"></span>
        <h1 id="sideTitle"></h1>
        <p class="blurb" id="sideBlurb"></p>
        <div class="cx-grid" id="cx"></div>

        <h5 id="legendHead">Colour key</h5>
        <div class="legend" id="legend"></div>

        <h5>Try your own input</h5>
        <form class="input-box" id="inputForm">
          <label for="inputField" id="inputLabel"></label>
          <input id="inputField" spellcheck="false" autocomplete="off" />
          <div class="row">
            <button class="btn btn-primary" type="submit">Run</button>
            <button class="btn btn-ghost" type="button" id="randomBtn">Random</button>
            <button class="btn btn-ghost" type="button" id="resetInput">Default</button>
          </div>
          <div class="err" id="inputErr"></div>
        </form>

        <h5>Pseudocode <span class="pill gray" id="lineChip">—</span></h5>
        <div class="code" id="code"></div>

        <h5>Variables</h5>
        <div class="vars" id="vars"></div>
      </div>
      <div class="side-foot">
        <span class="mono" style="color:var(--muted)">Week <span id="sideWeek"></span></span>
        <a id="slidesLink" href="#" target="_blank" rel="noopener">Lecture slides ↗</a>
      </div>
    </aside>

    <div class="toast glass" id="toast"></div>
  </div>
  <script type="module" src="/src/lab.js"></script>
</body>
</html>
